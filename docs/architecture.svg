    <text x="816" y="722" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">versioned · 30d retention</text>
    <text x="816" y="738" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">365d → COLDLINE</text>
