    <path d="M 80 0 L 80 880 M 160 0 L 160 880 M 240 0 L 240 880 M 320 0 L 320 880 M 400 0 L 400 880 M 480 0 L 480 880 M 560 0 L 560 880 M 640 0 L 640 880 M 720 0 L 720 880 M 800 0 L 800 880 M 880 0 L 880 880 M 960 0 L 960 880 M 1040 0 L 1040 880 M 1120 0 L 1120 880 M 1200 0 L 1200 880"/>
