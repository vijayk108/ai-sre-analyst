    <text x="556" y="722" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">timeline · evidence · steps tabs</text>
    <text x="556" y="738" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">incident detail view</text>

    <rect x="800" y="680" width="220" height="80" rx="8" fill="url(#card)" stroke="#2a3140"/>
